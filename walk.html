    if (!wasGrounded) { const hard = impact > 12 || P.airT > 1.2; P.landSpeedCap = hard ? V.run * 0.5 : 99; P.state = 'land'; P.stateT = 0;
      one(hard ? (moving && has('SM2LND2RUNHARD') ? 'SM2LND2RUNHARD' : 'SM2JMPCHGLND') : (moving ? 'SMJMPTWOLNDSOFT' : 'SM2JMPCHGLND')); }
  } else if (!launching) { P.grounded = false; if (P.state !== 'air' && P.vy < -3) { P.state = 'air'; P.airT = 0.3; } }
  if (P.feet.y < -40) respawn();
  doors();
  // --- animation: gait loops share one foot phase advanced by distance travelled; everything else is a one-shot clip
  const s = P.speed; const f = s < V.walk ? s / V.walk : s < V.run ? (s - V.walk) / (V.run - V.walk) : Math.min(1, (s - V.run) / Math.max(0.1, V.sprint - V.run));
  const cyc = s < V.walk ? dist(WALK, 1.94) : s < V.run ? THREE.MathUtils.lerp(dist(WALK, 1.94), dist('SMRUN18', 4.46), f) : THREE.MathUtils.lerp(dist('SMRUN18', 4.46), dist('SM2SPRINT', 5.35), f);
  if (s > 0.05) P.phase = (P.phase + dt * s / cyc) % 1;

  for (const n in W) W[n] = 0;
  const ps = P.state;
  if (ps === 'ground') {
    if (P.crouch) { const c = A.SM2IDL2CRCH; W[c && c.isRunning() && c.time < DUR.SM2IDL2CRCH - 0.05 ? 'SM2IDL2CRCH' : 'SM2CRCHIDL'] = 1; }
    else if (P.clip === 'SM2CRCH2IDL' && A.SM2CRCH2IDL.isRunning() && A.SM2CRCH2IDL.time < DUR.SM2CRCH2IDL - 0.05) W.SM2CRCH2IDL = 1;
    else if (s < V.walk) { W[IDLE] = 1 - f; W[WALK] = f; } else if (s < V.run) { W[WALK] = 1 - f; W.SMRUN18 = f; } else { W.SMRUN18 = 1 - f; W.SM2SPRINT = f; }
  }
  else if (ps === 'air') W[P.airT > 0.7 && P.vy < -5 && has('SMFALL') ? 'SMFALL' : (P.runJump && has('SM2JMPRUNCHGFLY') ? 'SM2JMPRUNCHGFLY' : 'SM2JMPCHGFLY')] = 1;
  else if (P.clip) W[P.clip] = 1;                                     // launch / stop / turn / land / fidget
  else W[IDLE] = 1;
  let rootY = 0, wsum = 0, yx = 0, yz = 0; const fade = (ps === 'ground') ? 9 : 16;
  for (const n in A) { const a = A[n]; const cur = a.getEffectiveWeight(); const w = cur + Math.max(-fade * dt, Math.min(fade * dt, W[n] - cur)); a.setEffectiveWeight(w); if (w > 1e-3) { rootY += w * contactAt(n, a.time); wsum += w; yx += w * Math.sin(YAW[n] || 0); yz += w * Math.cos(YAW[n] || 0); } }
  const bodyYaw = wsum > 0 ? Math.atan2(yx, yz) : 0;
  mixer.update(dt);
  // the rig root follows the measured foot contact of the blended pose; small steps are smoothed visually
  P.visY = P.grounded ? P.visY + (P.feet.y - P.visY) * Math.min(1, 16 * dt) : P.feet.y;
  hero.position.set(P.feet.x, P.visY + (wsum > 0 ? rootY / wsum : 1.0), P.feet.z); hero.rotation.set(0, P.heading - bodyYaw, 0);   // cancel the clips' authored body yaw so the feet point along the heading
  // --- shadow + camera (gently settles behind the hero while he moves, unless the player is steering it)
  const sg = P.grounded ? g : groundBelow(P.feet.x, P.feet.y, P.feet.z, 0.2, 30);
  if (sg) { shadow.visible = true; shadow.position.set(P.feet.x, sg.point.y + 0.02, P.feet.z); const h = Math.max(0, P.feet.y - sg.point.y); shadow.scale.setScalar(Math.max(0.5, 1 - h * 0.06)); shadow.material.opacity = Math.max(0.15, 1 - h * 0.08); } else shadow.visible = false;
  const manual = S.t - S.cam.manualAt < 1.2;
  if (!manual && s > V.walk) { const back = wrap((P.heading + Math.PI) - S.cam.yaw); if (Math.abs(back) > 0.25) { const rate = 0.9 * Math.min(1, s / V.run) * dt; S.cam.yaw += Math.max(-rate, Math.min(rate, back)); } }
  if (!manual) S.cam.pitch += (0.18 - S.cam.pitch) * Math.min(1, 0.8 * dt);
  const wantDist = 4.8 + 1.0 * Math.min(1, s / V.sprint); S.cam.dist += (wantDist - S.cam.dist) * Math.min(1, 2 * dt);
  const focus = new THREE.Vector3(P.feet.x, P.visY + (P.crouch ? 1.0 : 1.4), P.feet.z); focus.addScaledVector(dir, 0.5 * Math.min(1, s / V.sprint));
  const cdir = new THREE.Vector3(Math.sin(S.cam.yaw) * Math.cos(S.cam.pitch), Math.sin(S.cam.pitch), Math.cos(S.cam.yaw) * Math.cos(S.cam.pitch));
  let cd = S.cam.dist; const ch = wallHit(focus, cdir, cd + 0.3); if (ch) cd = Math.max(0.6, ch.distance - 0.3);

  if (!S.cam.pos) S.cam.pos = camWant.clone(); else S.cam.pos.lerp(camWant, Math.min(1, (ch ? 18 : 10) * dt));
  camera.position.copy(S.cam.pos); camera.lookAt(focus);
  const active = Object.keys(W).filter((n) => A[n].getEffectiveWeight() > 0.05).map((n) => `${n}:${A[n].getEffectiveWeight().toFixed(2)}`).join(' ');
  const hud = `${CIV ? 'civilian clips (Peter idle/walk)   ' : ''}state ${P.state}${P.crouch ? ' (crouch)' : ''}   speed ${P.speed.toFixed(1)} m/s   ${P.grounded ? 'on ' + S.groundName : 'airborne vy ' + P.vy.toFixed(1)}\npos ${P.feet.x.toFixed(1)}, ${P.feet.y.toFixed(2)}, ${P.feet.z.toFixed(1)}   colliders near ${S.near.length}/${S.colliders.length}   ${S.fps.toFixed(0)} fps\nclips ${active}\ngait speeds from root motion: walk ${V.walk.toFixed(2)}  run ${V.run.toFixed(2)}  sprint ${V.sprint.toFixed(2)} m/s`;
  if (!scripted || S.t % 0.5 < dt) $('hud').textContent = hud;
}

// ---- main loop ----------------------------------------------------------------------------------------------------------
let last = performance.now(); let fpsAcc = 0, fpsN = 0;
function loop() { requestAnimationFrame(loop); if (S.override) { renderer.render(scene, camera); return; }   // scripted mode: advanced by __sm2.step()
  const now = performance.now(); let dt = Math.min(0.05, (now - last) / 1000); last = now; fpsAcc += dt; fpsN++; if (fpsAcc > 0.5) { S.fps = fpsN / fpsAcc; fpsAcc = 0; fpsN = 0; }
  tick(dt); renderer.render(scene, camera); }
refreshNear(); const g0 = groundBelow(P.feet.x, 5, P.feet.z, 1, 20); if (g0) { P.feet.y = g0.point.y; P.visY = P.feet.y; }
status(`ready — ${HERO.split('/').pop()} · ${S.colliders.length} colliders (${nHull} game hulls, ${nRender} render meshes); ${Object.keys(A).length} clips, foot contact from ${FEET.length} foot bones; walk ${V.walk.toFixed(1)} run ${V.run.toFixed(1)} sprint ${V.sprint.toFixed(1)} m/s`);
window.__sm2.ready = true; loop();
</script></body></html>
